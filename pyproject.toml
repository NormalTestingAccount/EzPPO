[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezppo"
version = "0.1.0"
description = "A simple PPO library for Discrete and Continuous environments"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "gymnasium",
    "numpy",
]
readme = "README.md"
[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["ezppo*"]
